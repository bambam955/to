name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go vet
        run: go vet ./...

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./shell"
        env:
          SHELLCHECK_OPTS: --enable=all --shell=bash

  check_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: mfinelli/setup-shfmt@v4

      - name: Run go fmt
        run: go fmt ./... && git diff --exit-code

      - name: Run shfmt
        run: shfmt -i 4 -w . && git diff --exit-code
