name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build uses the Go version pinned in mise.toml.
      - uses: jdx/mise-action@v4
        with:
          install_args: go

      - name: Build binary
        run: cd src/backend && go build -ldflags "-X main.buildVersion=${TO_VERSION:-dev}" -o ../../bin/to-backend ./cmd

      - name: Check binary exists and is executable
        run: |
          test -f bin/to-backend && echo "Build successful"
          test -x bin/to-backend && echo "Binary is executable"
