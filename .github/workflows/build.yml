name: Build

on:
  push:
    branches: [main, 001-feat-bash-golang-integration]
  pull_request:
    branches: [main, 001-feat-bash-golang-integration]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        run: go build -o bin/to-backend ./cmd/to-backend

      - name: Check binary exists
        run: test -f bin/to-backend && echo "Build successful"

      - name: Check binary is executable
        run: test -x bin/to-backend && echo "Binary is executable"
