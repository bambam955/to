name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        run: go build -o bin/to-backend ./cmd/to-backend

      - name: Check binary exists and is executable
        run: |
          test -f bin/to-backend && echo "Build successful"
          test -x bin/to-backend && echo "Binary is executable"
