name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: go

      - name: Run unit tests
        run: cd src/backend && go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: src/backend/coverage.out

  integration_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, zsh, fish]
    steps:
      - uses: actions/checkout@v5

      # Shell packages come from apt; the backend binary still comes from mise-managed Go.
      - run: sudo apt-get install -y ${{ matrix.shell }}
      - uses: jdx/mise-action@v4
        with:
          install_args: go

      - name: Build binary
        run: cd src/backend && go build -ldflags "-X main.buildVersion=${TO_VERSION:-dev}" -o ../../bin/to-backend ./cmd

      - name: Run integration tests
        run: bash tests/integration/runner.sh ${{ matrix.shell }}
