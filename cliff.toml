# git-cliff configuration for the to release workflow.
# The file keeps release notes stable by generating the entire changelog from
# Conventional Commit history and exact bare semantic version tags.

[changelog]
header = """
# Changelog

All notable changes to `to` are documented in this file.

This changelog is generated from Conventional Commit history with `git-cliff`.
"""

body = """
{% set repo_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% set release_label = version | default(value="Unreleased") -%}
{% set release_target = version | default(value="HEAD") -%}
{% if previous.version %}
## [{{ release_label }}]({{ repo_url }}/compare/{{ previous.version }}...{{ release_target }}){% if version %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}
## [{{ release_label }}]{% if version %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | trim | upper_first }}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ repo_url }}/pull/{{ commit.remote.pr_number }})){% endif %}
{% endfor -%}

{% endfor -%}
"""

trim = true
render_always = true
footer = """

<!-- This changelog is generated by git-cliff. Do not edit manually. -->
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = true
fail_on_unmatched_commit = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"

commit_preprocessors = [
    # GitHub squash merge titles often end with "(#123)". Strip that suffix so the
    # template can append a canonical linked PR reference from remote metadata.
    { pattern = " \\(#([0-9]+)\\)(\\n|$)", replace = "$2" },
]

commit_parsers = [
    { message = "^Initial commit$", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^refactor", group = "Refactors" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(changelog\\): prepare release [0-9]+\\.[0-9]+\\.[0-9]+$", skip = true },
    { message = "^chore", group = "Maintenance" },
    { message = "^spec", skip = true },
]

[remote.github]
owner = "bambam955"
repo = "to"
